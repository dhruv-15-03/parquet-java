name: Validate statistics truncation

on:
  push:
    branches:
      - validation/stats-truncation-20260924
    paths:
      - parquet-hadoop/src/test/java/org/apache/parquet/format/converter/TestParquetMetadataConverter.java
      - .github/workflows/validate-statistics-truncation.yml

permissions:
  contents: read

concurrency:
  group: statistics-truncation-validation
  cancel-in-progress: false

jobs:
  validate:
    if: github.repository == 'dhruv-15-03/parquet-java' && github.event.repository.fork
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    env:
      MAVEN_OPTS: -Xmx512m -XX:ActiveProcessorCount=1
      BASE_SHA: 2df8d02678dab4bb8b926a0d3221cc652984c7ab
      TEST_SOURCE: parquet-hadoop/src/test/java/org/apache/parquet/format/converter/TestParquetMetadataConverter.java
      TEST_SHA256: b9e9fad0028142c1652d461e2823e6951075e08a3355836e9c79a65f9b6ae35f
    steps:
      - name: Check out the exact validation commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 3
          persist-credentials: false

      - name: Check scope and runner resources
        run: |
          python3 - <<'PY'
          import hashlib
          import json
          import os
          import pathlib
          import shutil
          import subprocess

          if os.environ["GITHUB_RUN_ATTEMPT"] != "1":
              raise SystemExit("Reruns are not authorized; a corrective attempt needs a new commit.")
          subprocess.run(["git", "merge-base", "--is-ancestor", os.environ["BASE_SHA"], "HEAD"], check=True)
          changed = set(subprocess.check_output(
              ["git", "diff", "--name-only", os.environ["BASE_SHA"], "HEAD"], text=True).splitlines())
          allowed = {os.environ["TEST_SOURCE"], ".github/workflows/validate-statistics-truncation.yml"}
          if changed != allowed:
              raise SystemExit(f"Unexpected changed files: {sorted(changed)}")
          source_hash = hashlib.sha256(pathlib.Path(os.environ["TEST_SOURCE"]).read_bytes()).hexdigest()
          if source_hash != os.environ["TEST_SHA256"]:
              raise SystemExit("Test source does not match the recorded patch.")
          memory = {line.split(":")[0]: int(line.split()[1]) * 1024
                    for line in pathlib.Path("/proc/meminfo").read_text().splitlines()}
          disk = shutil.disk_usage(".").free
          if disk < 4 * 1024**3 or memory["MemAvailable"] < 2 * 1024**3:
              raise SystemExit(f"Resource gate failed: disk={disk}, memory={memory['MemAvailable']}")
          print(json.dumps({"source_sha256": source_hash, "disk_free_bytes": disk,
                            "available_memory_bytes": memory["MemAvailable"]}, sort_keys=True))
          subprocess.run(["git", "diff", "--check"], check=True)
          PY

      - name: Set up Temurin 17
        uses: actions/setup-java@dd06d9cba3e5552c54d9f8ea23572deb30010f7c
        with:
          distribution: temurin
          java-version: '17'

      - name: Provision verified Maven and Thrift
        id: toolchain
        timeout-minutes: 25
        run: |
          set -euo pipefail
          cd "$RUNNER_TEMP"
          curl --fail --location --silent --show-error --retry 0 \
            --connect-timeout 30 --max-time 300 \
            https://repo.maven.apache.org/maven2/org/apache/maven/apache-maven/3.9.16/apache-maven-3.9.16-bin.tar.gz \
            --output apache-maven-3.9.16-bin.tar.gz
          echo '831a8591fe20c8243b1dbe7d71e3244f31d1665b0804b2e825e38cbbe5ce0cafb8338851f90780735568773e0a6cd07bbec107cda0b896b008b861075358b6f6  apache-maven-3.9.16-bin.tar.gz' | sha512sum --check
          tar -xzf apache-maven-3.9.16-bin.tar.gz
          echo "$RUNNER_TEMP/apache-maven-3.9.16/bin" >> "$GITHUB_PATH"

          curl --fail --location --silent --show-error --retry 0 \
            --connect-timeout 30 --max-time 300 \
            https://archive.apache.org/dist/thrift/0.24.0/thrift-0.24.0.tar.gz \
            --output thrift-0.24.0.tar.gz
          echo 'e0fa5839a4c5c1d631b0931cf2c554ebbfa4e2fee3a9fb3ffd4f82ce4396c6e4  thrift-0.24.0.tar.gz' | sha256sum --check
          sudo apt-get update -qq
          sudo apt-get install -y -qq --no-install-recommends \
            build-essential pv autoconf automake libtool curl make g++ unzip \
            libboost-dev libboost-test-dev libboost-program-options-dev \
            wget libevent-dev flex bison pkg-config libssl-dev xmlstarlet
          tar -xzf thrift-0.24.0.tar.gz
          cd thrift-0.24.0
          {
            bash configure --disable-libs --prefix="$RUNNER_TEMP/thrift-install"
            make -j1
            make -j1 install
          } > "$RUNNER_TEMP/parquet-native.log" 2>&1
          "$RUNNER_TEMP/thrift-install/bin/thrift" -version | grep -Fx 'Thrift version 0.24.0'
          echo "$RUNNER_TEMP/thrift-install/bin" >> "$GITHUB_PATH"

      - name: Record toolchain and recheck build resources
        run: |
          set -euo pipefail
          {
            java -Xmx64m -version
            javac -J-Xmx64m -version
            mvn -version
            thrift -version
            git rev-parse HEAD
          } 2>&1 | tee "$RUNNER_TEMP/parquet-toolchain.log"
          python3 - <<'PY'
          import pathlib
          import shutil
          memory = {line.split(":")[0]: int(line.split()[1]) * 1024
                    for line in pathlib.Path("/proc/meminfo").read_text().splitlines()}
          if shutil.disk_usage(".").free < 4 * 1024**3 or memory["MemAvailable"] < 2 * 1024**3:
              raise SystemExit("Insufficient resources before Maven; no build started.")
          PY

      - name: Compile the selected reactor and run two converter tests
        id: tests
        run: |
          set -euo pipefail
          date +%s > "$RUNNER_TEMP/parquet-tests-started"
          mvn -B -ntp -T 1 -pl parquet-hadoop -am package \
            '-Dtest=TestParquetMetadataConverter#testBinaryStatsWithTruncation+testBinaryStatsWithTruncationAtSizeLimit' \
            -Dsurefire.failIfNoSpecifiedTests=false \
            -DforkCount=1 -DreuseForks=true \
            -Djunit.jupiter.execution.parallel.enabled=false \
            '-Dsurefire.argLine=-Xmx256m -XX:ActiveProcessorCount=1 -XX:MaxJavaStackTraceDepth=8' \
            -Dmaven.javadoc.skip=true -Dsource.skip=true \
            > "$RUNNER_TEMP/parquet-maven.log" 2>&1

      - name: Check formatting without modifying source
        id: formatting
        if: always() && steps.toolchain.outcome == 'success'
        run: |
          set -euo pipefail
          mvn -B -ntp -T 1 -pl parquet-hadoop spotless:check \
            > "$RUNNER_TEMP/parquet-spotless.log" 2>&1

      - name: Emit bounded evidence and require actual test success
        if: always()
        env:
          TEST_OUTCOME: ${{ steps.tests.outcome }}
          FORMAT_OUTCOME: ${{ steps.formatting.outcome }}
        run: |
          python3 - <<'PY'
          import base64
          import hashlib
          import json
          import os
          import pathlib
          import subprocess
          import xml.etree.ElementTree as ET

          temp = pathlib.Path(os.environ["RUNNER_TEMP"])
          expected = {"testBinaryStatsWithTruncation", "testBinaryStatsWithTruncationAtSizeLimit"}
          report = pathlib.Path("parquet-hadoop/target/surefire-reports/"
                                "TEST-org.apache.parquet.format.converter.TestParquetMetadataConverter.xml")
          evidence = {
              "head": subprocess.check_output(["git", "rev-parse", "HEAD"], text=True).strip(),
              "run_id": os.environ["GITHUB_RUN_ID"],
              "run_attempt": os.environ["GITHUB_RUN_ATTEMPT"],
              "test_step": os.environ["TEST_OUTCOME"],
              "format_step": os.environ["FORMAT_OUTCOME"],
              "source_sha256": hashlib.sha256(pathlib.Path(os.environ["TEST_SOURCE"]).read_bytes()).hexdigest(),
              "report_present": report.exists(),
          }
          valid_report = False
          if report.exists():
              raw = report.read_bytes()
              suite = ET.fromstring(raw)
              cases = suite.findall("testcase")
              counts = {key: int(suite.get(key, "-1")) for key in ("tests", "failures", "errors", "skipped")}
              names = [case.get("name") for case in cases]
              started = temp / "parquet-tests-started"
              fresh = started.exists() and report.stat().st_mtime >= int(started.read_text().strip())
              valid_report = (
                  counts == {"tests": 2, "failures": 0, "errors": 0, "skipped": 0}
                  and len(cases) == 2 and set(names) == expected and fresh
                  and all(case.get("classname") == "org.apache.parquet.format.converter.TestParquetMetadataConverter"
                          and not any(case.find(tag) is not None for tag in ("failure", "error", "skipped"))
                          for case in cases)
              )
              evidence.update({"counts": counts, "test_names": names, "fresh": fresh,
                               "raw_report_sha256": hashlib.sha256(raw).hexdigest()})
              sanitized = ET.Element("testsuite", {key: suite.get(key, "") for key in
                                     ("name", "tests", "failures", "errors", "skipped", "time")})
              for case in cases:
                  clean_case = ET.SubElement(sanitized, "testcase", {
                      key: case.get(key, "") for key in ("classname", "name", "time")})
                  for tag in ("failure", "error", "skipped"):
                      for child in case.findall(tag):
                          clean_child = ET.SubElement(clean_case, tag, {
                              key: child.get(key, "")[:2000] for key in ("type", "message")})
                          clean_child.text = (child.text or "")[:4000]
              print("PARQUET_JUNIT_XML_BASE64=" + base64.b64encode(ET.tostring(sanitized)).decode("ascii"))
          else:
              evidence["report_error"] = "No actual Surefire report was produced."
          clean = subprocess.run(["git", "diff", "--exit-code"], check=False).returncode == 0
          success = (valid_report and clean
                     and evidence["source_sha256"] == os.environ["TEST_SHA256"]
                     and evidence["test_step"] == "success" and evidence["format_step"] == "success")
          evidence.update({"tracked_source_clean": clean, "validation_passed": success})
          print("PARQUET_VALIDATION_EVIDENCE=" + json.dumps(evidence, sort_keys=True))
          for name in ("parquet-toolchain.log", "parquet-native.log", "parquet-maven.log", "parquet-spotless.log"):
              log = temp / name
              if log.exists():
                  with log.open("rb") as stream:
                      stream.seek(max(0, log.stat().st_size - 32768))
                      tail = stream.read(32768).decode("utf-8", errors="replace")
                  print(f"--- BOUNDED LOG TAIL: {name} ---")
                  print(tail)
          if not success:
              raise SystemExit("Validation is incomplete or failed; see the actual step/report evidence.")
          PY
